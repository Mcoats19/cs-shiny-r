<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Florida Blue – Success Plan Access</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         background:#0b1220;color:#e8eefc;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
    .card{background:#131c2e;max-width:520px;width:92%;padding:28px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    h1{font-size:1.25rem;margin:0 0 6px}
    p{opacity:.9;margin:.5rem 0 1rem;line-height:1.4}
    label{font-weight:600;font-size:.95rem}
    input[type=email]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2a3960;background:#0d1526;color:#e8eefc}
    button{margin-top:12px;width:100%;padding:12px 14px;border:0;border-radius:10px;background:#4f7cff;color:#fff;font-weight:700;cursor:pointer}
    .note{font-size:.85rem;opacity:.8;margin-top:10px}
    .err{color:#ffb3b3;margin-top:10px;display:none}
    .ok{color:#b7ffb7;margin-top:10px;display:none}
    .small{font-size:.8rem;opacity:.75}
  </style>
</head>
<body>
  <div class="card">
    <h1>Florida Blue — Success Plan Portal</h1>
    <p class="small">For privacy, please enter your work email to continue.</p>
    <form id="gate" novalidate>
      <label for="email">Work email</label><br/>
      <input id="email" name="email" type="email" placeholder="name@floridablue.com" required />
      <button type="submit">Continue</button>
      <div id="err" class="err">That email isn’t on the access list. If you need access, reply to Martineja Coats.</div>
      <div id="ok" class="ok">Verified — redirecting…</div>
      <p class="note">Only approved stakeholders can view this plan. Access may be revoked at any time.</p>
    </form>
  </div>

  <script>
    // 1) Allowed emails (testing)
    const allowedEmails = ["martinejacoats@gmail.com"].map(e => e.toLowerCase());

    // 2) Private link destination (your tokenized Posit Cloud URL)
    const privateUrl = "https://0199c9a5-9c1a-db72-d785-66894c753698.share.connect.posit.cloud/?private_link_token=pPHNOu3FFBEeYSxX9K8Hapl82eZq3dWb9eJWOQBsE82JPfq02xMbhJl9XYMG7Yp4";

    // 3) Gate logic
    const form = document.getElementById("gate");
    const emailInput = document.getElementById("email");
    const err = document.getElementById("err");
    const ok = document.getElementById("ok");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      err.style.display = "none";
      ok.style.display = "none";

      const email = (emailInput.value || "").trim().toLowerCase();
      const valid = allowedEmails.includes(email);

      if (!email || !/\S+@\S+\.\S+/.test(email)) {
        err.textContent = "Enter a valid work email.";
        err.style.display = "block";
        return;
      }
      if (!valid) {
        err.textContent = "That email isn’t on the access list. If you need access, reply to Martineja Coats.";
        err.style.display = "block";
        return;
      }
      ok.style.display = "block";
      setTimeout(() => { window.location.href = privateUrl; }, 650);
    });
  </script>
</body>
</html>
